[project]
name = "trekking-mcp"
version = "0.1.0"
description = "Server MCP per sentieri, rifugi e condizioni di montagna sulle Alpi italiane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alessandro Magliola" }]
keywords = ["mcp", "model-context-protocol", "hiking", "openstreetmap", "caaml", "avalanche"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "mcp>=2.0,<3.0",
    "httpx2>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# I minimi seguono le major effettivamente in uso (vedi uv.lock), non la prima
# versione che per caso funzionava. mypy 1.x e ruff 0.6 hanno default diversi
# da 2.x e 0.16: con i floor vecchi, `pip install -e ".[dev]"` poteva dare
# esiti diversi da `uv sync --frozen`, che e' quello che gira in CI.
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-httpx2>=1.0",
    "ruff>=0.16",
    "mypy>=2.3",
]

[project.scripts]
trekking-mcp = "trekking_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/19Alma98/trekking_mcp"
Issues = "https://github.com/19Alma98/trekking_mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trekking_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "-p", "pytest_httpx2"]
# Una API dell'SDK deprecata deve rompere la build, non stampare una riga che
# nessuno legge. E' il modo per accorgersi di una revisione del protocollo
# quando esce, invece che quando il supporto viene rimosso.
filterwarnings = [
    "error::mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trekking_mcp"]
