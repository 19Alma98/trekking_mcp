name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formattazione
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -v

      # I test non toccano la rete: se questo step fallisce, e' perche'
      # qualcuno ha introdotto una chiamata HTTP reale in un test.
      - name: Verifica che i test siano offline
        run: pytest -v
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
