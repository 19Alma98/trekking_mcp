name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - 'DEVELOPMENT.md'
      - 'TODOS.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - 'DEVELOPMENT.md'
      - 'TODOS.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installa uv
        run: python -m pip install --upgrade uv

      - name: Verifica che il lock sia allineato a pyproject.toml
        run: uv lock --check

      - name: Installa le dipendenze dal lock
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run ruff check .

      - name: Formattazione
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -v

      # I test non toccano la rete: se questo step fallisce, e' perche'
      # qualcuno ha introdotto una chiamata HTTP reale in un test.
      - name: Verifica che i test siano offline
        run: uv run pytest -v
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build immagine
        run: docker build -t trekking-mcp:ci .

      - name: Avvia e verifica /health
        run: |
          docker run -d --name tm -p 8000:8000 trekking-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "health non ha risposto entro 30s" >&2
          docker logs tm >&2 || true
          exit 1

      - name: Ferma il container
        if: always()
        run: docker rm -f tm
