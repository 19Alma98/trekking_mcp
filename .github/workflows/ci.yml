name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installa uv
        run: python -m pip install --upgrade uv

      - name: Verifica che il lock sia allineato a pyproject.toml
        run: uv lock --check

      - name: Installa le dipendenze dal lock
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run ruff check .

      - name: Formattazione
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -v

      # I test non toccano la rete: se questo step fallisce, e' perche'
      # qualcuno ha introdotto una chiamata HTTP reale in un test.
      - name: Verifica che i test siano offline
        run: uv run pytest -v
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
